[project]
name = "contract-analyzer"
version = "0.1.0"
description = "Read-only smart-contract risk analyst"
requires-python = ">=3.12,<3.13"
dependencies = [
    "web3>=8,<9",
    "pydantic>=2",
    "python-dotenv",
    "evmole>=0.9.4",
    "pypdf>=6.21.2",
    "fastembed>=0.9.1",
    "psycopg>=3.3.6",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live and not models' --strict-markers"
markers = [
    "live: hits real RPC or explorer endpoints (needs .env); skipped by default",
    "models: needs the downloaded retrieval models (python -m retrieval models); skipped by default",
]
