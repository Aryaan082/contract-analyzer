[[contract]]
id = "groklet"
label = "GROKLET (Grok Mascot): a known honeypot, buys work and sells revert"
chain = "ethereum"
address = "0x656bd1D70E24DE09744b89ea0De468d831Af5f55"
block = 26280500
expect = """\
high_risk: the sell rehearsal buys with no tax and then the sell reverts (simulate_sell verdict sell_blocked), and the validator \
does not accept a lower verdict. The report should cite that result, say that the pool exists and the buy works, and not claim \
to know the mechanism from the tools alone. Source and deployer are not checked."""
how_verified = """\
Three independent signals. (1) honeypot.is, run on all 760 tokens created on Uniswap V2 in the last 60,000 blocks: buy works, sell \
reverts, 100% sell tax, 626 of 628 holders could not sell. (2) Our own rehearsal at the pinned block: verdict sell_blocked, step \
sell, TransferHelper: TRANSFER_FROM_FAILED, buy tax 0%; it reproduced the same verdict on 7 of the 8 tokens honeypot.is rated worst. \
(3) The verified source on Etherscan (contract Token, solc 0.8.29) overrides balanceOf with a condition on the pair's balance and \
tx.origin that returns 0 otherwise, the kind of trick that makes a swap revert for ordinary wallets. I read these lines but have not \
traced the mechanism through the router."""

