[[contract]]
id = "usdc"
label = "USD Coin: a benign proxy token with mint, blacklist and pause"
chain = "ethereum"
address = "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
block = 26280500
expect = """\
A legacy OpenZeppelin proxy (identify) whose implementation, 0x43506849D7C04F9138D1A2050bbF3A0c054402dd, has mint, blacklist \
and pause functions; the proxy has upgrade functions and the admin, owner and blacklister read as accounts without code. \
The sell rehearsal passes with no tax. elevated_risk is the defensible verdict (centralised controls, typical of a regulated \
stablecoin, whose holders the tools cannot name); no_red_flags_found would need those controls stated plainly. Never "safe". \
Source, deployer and selector names must be listed as not checked."""
how_verified = """\
The address is the well-known USDC token; identify_contract at the pinned block finds a legacy_oz_slot proxy and read_getter \
returns name "USD Coin" and symbol "USDC". tests/test_identify_live.py already uses it as the legacy-proxy case."""

