# Which model the agent talks to and how much one run may use. This is the only place to change
# either. The model is Claude, reached through OpenRouter with the key used for embeddings
# (OPENROUTER_API_KEY in .env or the shell); a tier is a short name for `--model`, and any other
# value is passed to OpenRouter as a model slug as it is.
#
# Prices are USD per million tokens, as OpenRouter listed them on 2026-10-26. They are only a
# fallback: OpenRouter reports the cost of every reply, and that figure is what the cap counts.
default_model = "sonnet"

# Source review (review/, agent/review_stage.py): a second model reads a verified contract's source
# and the writer sees only closed records of what it flagged. It runs only when asked for
# (`python -m agent analyze --review`); nothing below is used otherwise.
reviewer_model = "eval"            # a tier below or a slug (decision 9: cheap to start, compare Sonnet)
confirmation_model = "haiku"       # the blind second reader. A placeholder, not measured: Aryaan picks
review_may_set_high_risk = false   # decision 11. On: a finding a second reader (another company) agrees
                                   # with may be rated high. Off until the benign set shows no false high.

[model.sonnet]
name = "anthropic/claude-sonnet-5.5"
input_per_mtok = 2.0
output_per_mtok = 10.0

# The cheap option, for simple runs; routing between the two is Component 7.
[model.haiku]
name = "anthropic/claude-haiku-5.5"
input_per_mtok = 0.10
output_per_mtok = 0.50

# The tier for the eval harness (`--model eval`). Chosen on 2026-10-27 by a smoke test of nine
# non-US models on the eight contracts: the cheapest model that did as well as any (about $0.006 a
# run, under $1 for 120 runs). Sonnet stays the default and is for final results. Its hidden
# thinking is billed as output and is counted in the cost the loop reports.
[model.eval]
name = "deepseek/deepseek-v4.1-flash-1017"
input_per_mtok = 0.15
output_per_mtok = 0.60

# Caps for one run. Reaching one never ends in an unchecked answer: the run stops, and the report
# says `insufficient_evidence` and which cap it was.
[limits]
max_turns = 12             # model calls
max_tool_calls = 25        # tool calls other than submit_report
max_output_tokens = 4096   # per model call
wall_clock_seconds = 420   # a sell rehearsal alone can take a minute
max_cost_usd = 0.75        # checked before every model call, from the cost OpenRouter reports
max_report_attempts = 3    # tries at a report that passes the citation validator
request_timeout_seconds = 90

# One source review. The review's dollars count in the run's max_cost_usd above (the review is also held
# to what the run has left); its seconds do not count in wall_clock_seconds, it has its own.
[reviewer]
ceiling_tokens = 300000         # new code over this is not reviewed at all, never half (decision 10)
chunk_tokens = 12000            # one reviewer call, about
max_cost_usd = 0.50             # per review (decision 9's development ceiling)
max_output_tokens = 8192        # per reviewer call; a model that thinks first bills that as output
wall_clock_seconds = 600        # unmeasured: 20 to 60 s a call was a guess
request_timeout_seconds = 180
