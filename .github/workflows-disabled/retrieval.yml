# NOT ENABLED. GitHub only reads .github/workflows/, so this file does nothing where it is, even
# if the repository is pushed. To switch it on (once the repository is on GitHub and the dev work
# is done), run:
#
#   git mv .github/workflows-disabled/retrieval.yml .github/workflows/retrieval.yml
#
# and then check three things first:
#   1. the action versions below are still the current major versions
#      (checked 2026-10-25: checkout v7, setup-uv v10, cache v6);
#   2. the baseline: evals/baseline_retrieval.json was saved on Apple Silicon. A Linux runner can
#      rank a borderline chunk differently, so if the first run fails on a tiny difference,
#      re-save the baseline from CI output (python -m evals.run retrieval --variants <name>
#      --save-baseline) and commit it;
#   3. that the cache key below matches the models you want (it follows retrieval/models.toml).
#
# What it does
#   tests  every pull request that touches the knowledge base, retrieval, evals or tests:
#          ruff and the whole offline test suite (fake models, no network).
#   eval   after tests pass: downloads the small models (cached), builds the index, and runs the
#          quiz on the DEV questions for the core variants. It fails only if the baseline variant
#          is confidently worse than the saved baseline on the same questions (see
#          evals/run.py, _check_baseline), so ordinary noise does not break a pull request.
#   held-out  only when started by hand with the box ticked. Never on a pull request: if every
#          pull request could see the held-out score it would turn into something to tune against.

name: retrieval

on:
  pull_request:
    paths:
      - "knowledge/**"
      - "retrieval/**"
      - "evals/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
  workflow_dispatch:
    inputs:
      held_out:
        description: "Run the held-out questions (milestones only)"
        type: boolean
        default: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  eval:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --frozen
      - uses: actions/cache@v6
        with:
          path: ~/.cache/contract-analyzer/models
          key: models-small-${{ hashFiles('retrieval/models.toml') }}
      # Downloads only what is missing from the cache: about 150 MB for the small pair.
      - run: uv run python -m retrieval models --tier small
      # The local small model on purpose: CI has no OpenRouter key and must stay offline-capable.
      - run: uv run python -m retrieval index --embedder small
      - run: uv run python -m evals.run retrieval --variants core --check-baseline

  held-out:
    if: github.event_name == 'workflow_dispatch' && inputs.held_out
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --frozen
      - uses: actions/cache@v6
        with:
          path: ~/.cache/contract-analyzer/models
          key: models-small-${{ hashFiles('retrieval/models.toml') }}
      - run: uv run python -m retrieval models --tier small
      - run: uv run python -m evals.run retrieval --variants core --held-out
