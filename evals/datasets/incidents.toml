# Incidents for the beyond-reach class (Component 6, part C).
#
# Taken from the public DeFiHackLabs repository (https://github.com/SunWeb3Sec/DeFiHackLabs),
# Apache License 2.0, Copyright 2022-2026 DeFiHackLabs. Its LICENSE was read first (copy in
# evals/datasets/licenses/DeFiHackLabs-LICENSE, sha256 aa728951...a102bae) and allows copying and
# using small parts with the notice kept. What was taken: the incident list in the README (names,
# dates), and the first 5 KB of each of the proof-of-concept files below for the vulnerable
# contract's address and the block of the drain transaction. The `reason` texts are our own
# one-line description of the KIND of bug; no exploit code, call sequence or amount is copied. The
# changes (selection, our wording, a pinned block one before the attack) are ours, not theirs.
#
# Every contract here is a real Ethereum contract whose logic had a bug. The agent's tools never
# read logic, so these are not scored for detection; the question is whether the report says what
# it did not check. All 10 were chosen because the header names the vulnerable contract's address
# and the drain transaction on Ethereum mainnet; nothing was picked or dropped by what the agent
# said about them (no agent has been run on them).

[[incident]]
name = "BalancerV1BPool"
date = "2026-08-31"
address = "0x2257aaac34bcb27900291f7b84ee2565a6cbac57"
attack_block = 25872274
taxonomy = ["arithmetic-and-rounding"]
poc = "src/test/2026-08/BalancerV1BPool_exp.sol"
reason = "A Balancer V1 pool whose pricing arithmetic rounds in the caller's favour for a low-decimal asset; a logic bug in the contract, not an admin or key problem."

