# Candidate judge models for the faithfulness judge (Component 6, part D).
#
# NOTHING HERE HAS BEEN CALLED. Prices were read on 2026-10-28 from OpenRouter's public
# per-model endpoint listings (https://openrouter.ai/api/v1/models/<slug>/endpoints), USD per
# million tokens. A model is served by several providers at different prices, and the run is routed
# to a provider that accepts a JSON-schema request, so `input_per_mtok` and `output_per_mtok` are the
# DEAREST such provider's prices: they bound the worst case the spend cap reserves for a call. What
# the run counts afterwards is the cost OpenRouter reports for each reply. Re-read the listing before
# a paid run: prices and providers move.
#
# Rules for a judge: not American (the eval-model rule), not DeepSeek (the agent's eval model) and not
# Anthropic (the product model), and the two judges that are kept come from two different companies.
# ONE EXCEPTION, the last entry: deepseek-v4.1-flash is tried as a third column at Aryaan's request
# (2026-10-28). It is the same company, and the same model, as the agent's eval tier, so shared blind
# spots and a taste for its own wording are possible. It is a comparison only: the kept pair stays
# Alibaba + Z.ai.
# `max_tokens` leaves room for hidden thinking: a model that thinks first spends part of it before it
# writes the JSON. At 2500, 27 of 103 qwen3.7-flash replies on the check set (all 16 summaries) were
# spent on thinking alone and cut off (2026-10-28), so it is 6000. A reply cut off by the limit is
# recorded as refused (`cut_off`), not guessed.

[[judge]]
slug = "qwen/qwen3.7-flash"            # Alibaba. Cheapest candidate.
input_per_mtok = 0.115                 # listed 0.03 to 0.0345; 0.115 is its price for prompts over 32k tokens
output_per_mtok = 0.46                 # listed 0.13 to 0.15; 0.46 likewise
max_tokens = 6000
structured = "json_object"   # a strict JSON-schema request found no provider (HTTP 404, 2026-10-28)
note = "Alibaba; listed with response_format, not structured_outputs. Prices read 2026-10-28. Tried 2026-10-28: thinks first (median 1,500 hidden tokens), hence max_tokens 6000. Measured $0.046 for the check set."

[[judge]]
slug = "z-ai/glm-5.3-flash"            # Z.ai. Cheap candidate.
input_per_mtok = 0.281                 # providers range 0.045 to 0.281; the dearest is the bound
output_per_mtok = 0.75
max_tokens = 6000
note = "Z.ai; 38 providers, most accept response_format and structured outputs. Prices read 2026-10-28. Tried 2026-10-28: $0.098 for the check set; about 3% of replies still cut off at 12,000 tokens, one of them a loop of whitespace after an opening quote."

[[judge]]
slug = "xiaomi/mimo-v2.6-pro"          # Xiaomi. Mid-priced; a thinking model in the smoke test.
input_per_mtok = 0.522
output_per_mtok = 1.044
max_tokens = 6000
note = "Xiaomi; providers 0.37 to 0.52 in, 0.74 to 1.04 out. Hidden thinking averaged about 4,700 tokens per agent run in the smoke test. Prices read 2026-10-28."

[[judge]]
slug = "minimax/minimax-m3"             # MiniMax. Mid-priced; a thinking model in the smoke test.
input_per_mtok = 0.60
output_per_mtok = 2.40
max_tokens = 6000
note = "MiniMax; 13 providers, 0.22 to 0.60 in, 0.88 to 2.40 out, only some accept JSON-schema output. Prices read 2026-10-28."

[[judge]]
slug = "deepseek/deepseek-v4.1-flash-1017"   # DeepSeek. EXCEPTION to the rule above: the agent's own eval model.
input_per_mtok = 0.45                  # 38 providers range 0.015 to 0.45; DeepSeek's own is 0.15 but lists no structured_outputs
output_per_mtok = 1.80                 # 0.15 to 1.80 (Fireworks/us is the dearest that accepts a JSON-schema request); DeepSeek's own is 0.60
max_tokens = 6000
note = "DeepSeek; 38 providers, 0.015 to 0.45 in and 0.15 to 1.80 out, most accept response_format and structured outputs (DeepSeek's own endpoint lists response_format only). Prices read 2026-10-28. Same company as the agent's eval model: a third column, not a candidate for the kept pair. Tried 2026-10-28: a strict JSON-schema request was accepted on the first call (15 providers routed); $0.0575 for the check set; no reply cut off (median 235 completion tokens, longest 5,189, so 6000 only just clears it)."
