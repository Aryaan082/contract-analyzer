# The faithfulness check set: what it is made of (Component 6, part D).
#
# THE FAULTS ARE OURS. Every "planted" fault below was written by the session that built the judge,
# as a small edit to a real claim from a saved dev trace (the 13 Sonnet runs of the eight dev
# contracts); every "real" fault is a claim or summary sentence a model actually wrote, picked
# because an earlier reader (the 2026-10-27 smoke-test session) found it unsupported, and the
# reasons are in `note`. Nobody else has read these. A judge that catches them has shown it catches
# the kinds of fault we thought of, not the kinds we did not.
#
# Built offline from dev traces only (python -m evals.judge checkset build --traces <folder>); the
# result is committed in evals/judge/checkset/ so that it does not depend on the traces being there.
# Held-out contracts are never used: the eight contracts here are the dev-only cards of
# agent/contracts.toml.
#
# Entries:
#   [[planted]]  an edit of one real claim. `trace` is the file name of the trace and `finding` the
#                claim's number in its report (from 0). `replace` is a list of [old, new] pairs
#                applied in order to the claim text (each `old` must occur); `append` adds text at
#                the end; `evidence` swaps the cited ids. The unedited claim goes in too, as the
#                "twin" (a sound item) unless `twin = false`.
#                `twin_tokens` must occur in the evidence the claim cites (so the sound claim's key
#                facts are really there); `absent_tokens` must not occur (so the planted fact is
#                really absent). The build stops if either is wrong.
#                `catch` lists the labels that count as catching this fault.
#   [[sound]]    a real claim believed to follow from its evidence, read by one person (the author).
#   [[real]]     a real claim believed NOT to follow from its evidence.
#   [[summary]]  a summary to judge sentence by sentence; `fault` and `sound` list sentence numbers
#                (from 1) whose label is scored; the others are judged but not scored. `insert`
#                adds a sentence at a position; `replace` edits the text.

