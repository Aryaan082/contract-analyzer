# The sell-rehearsal sandbox: Solidity that runs on a fork of a live chain, inside Foundry's local
# EVM. Nothing here is sent to a real chain. Run by chain/sandbox.py, not by hand.
[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
# The rehearsal writes its result as JSON into results/.
fs_permissions = [{ access = "read-write", path = "./results" }]
